spring.application.name=neon-ledger-backend

# Database Configuration (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:bankdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Local demo database. Data is reset whenever the application restarts.
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.servlet.multipart.enabled=true
server.port=${PORT:8080}

# Demo security. Override these values outside local development.
app.security.username=${APP_SECURITY_USERNAME:admin}
app.security.password=${APP_SECURITY_PASSWORD:change-me-locally}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:3000}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
